apiVersion: v1
kind: ServiceAccount
metadata:
  name: log-monitor
  namespace: log-monitor
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: log-monitor
rules:
  - apiGroups: [""]
    resources: ["namespaces", "pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
  # 用于把 ReplicaSet 反查成 Deployment，实现同一工作负载告警收敛
  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: log-monitor
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: log-monitor
subjects:
  - kind: ServiceAccount
    name: log-monitor
    namespace: log-monitor
